name: Import du site
on:
  push:
    paths: [".github/workflows/import.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger et extraire le projet
        run: |
          if [ -f package.json ]; then echo "Projet déjà importé"; exit 0; fi
          curl -fsSL "https://d2ol7oe51mr4n9.cloudfront.net/user_3MC0pJdJosLmJpeeeqjb9HT2BjM/792ac427-44e1-438b-871e-7211cc7d1ae2.zip" -o /tmp/site.zip
          unzip -q /tmp/site.zip -d /tmp/site
          cp -r /tmp/site/marche-des-capitaux/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import du site Marché des capitaux"
          git push
